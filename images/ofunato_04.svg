<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- 青空グラデーション（太陽なし） -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <style>
      .outline { stroke: #1e293b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .mid-line { stroke: #1e293b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .fine-line { stroke: #1e293b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- 1. 爽やかな青空 -->
  <rect width="400" height="300" fill="url(#skyGrad)"/>

  <!-- 白い雲 -->
  <g fill="#ffffff" class="mid-line">
    <path d="M 25 45 Q 40 32 65 38 Q 80 28 95 38 Q 108 38 112 48 Q 115 58 100 64 L 30 64 Z"/>
    <path d="M 280 35 Q 295 22 315 28 Q 330 18 345 28 Q 358 28 362 38 Q 365 48 350 52 L 285 52 Z"/>
  </g>

  <!-- 2. 背後の雄大な山並み（五葉山・猪川の山々） -->
  <path d="M 0 100 Q 120 50 240 75 T 400 60 L 400 140 L 0 140 Z" fill="#86efac"/>
  <path class="outline" fill="#22c55e" d="M 0 115 Q 150 70 280 100 T 400 85 L 400 160 L 0 160 Z"/>

  <!-- 高台の敷地・緑地 -->
  <path class="outline" fill="#cbd5e1" d="M 0 170 L 400 170 L 400 300 L 0 300 Z"/>
  <!-- 手前の緑の斜面・植え込み -->
  <path class="outline" fill="#15803d" d="M 0 240 Q 120 220 200 245 L 200 300 L 0 300 Z"/>

  <!-- ==========================================
       3. 大船渡高校（白い長大校舎棟＋大屋根の体育館＋黄色いイチョウの木）
       ========================================== -->

  <!-- [A] 奥の長大な白い本館校舎棟（4階建て・横長校舎） -->
  <g id="main-school-building" transform="translate(60, 95)">
    <!-- 校舎外壁（白） -->
    <rect x="0" y="25" width="200" height="60" fill="#ffffff" class="outline"/>
    <!-- 屋上パラペット -->
    <rect x="0" y="20" width="200" height="8" fill="#e2e8f0" class="fine-line"/>
    <rect x="135" y="10" width="45" height="15" fill="#f8fafc" class="fine-line"/>

    <!-- 連続する教室窓（4フロアの横長ガラス窓列） -->
    <g fill="#38bdf8" class="fine-line">
      <!-- 4階窓 -->
      <rect x="10" y="32" width="20" height="6" rx="1"/>
      <rect x="35" y="32" width="20" height="6" rx="1"/>
      <rect x="60" y="32" width="20" height="6" rx="1"/>
      <rect x="85" y="32" width="20" height="6" rx="1"/>
      <rect x="110" y="32" width="20" height="6" rx="1"/>
      <!-- 3階窓 -->
      <rect x="10" y="44" width="20" height="6" rx="1"/>
      <rect x="35" y="44" width="20" height="6" rx="1"/>
      <rect x="60" y="44" width="20" height="6" rx="1"/>
      <rect x="85" y="44" width="20" height="6" rx="1"/>
      <rect x="110" y="44" width="20" height="6" rx="1"/>
      <!-- 2階窓 -->
      <rect x="10" y="56" width="20" height="6" rx="1"/>
      <rect x="35" y="56" width="20" height="6" rx="1"/>
      <rect x="60" y="56" width="20" height="6" rx="1"/>
      <rect x="85" y="56" width="20" height="6" rx="1"/>
      <rect x="110" y="56" width="20" height="6" rx="1"/>
      <!-- 1階窓・エントランス -->
      <rect x="10" y="68" width="20" height="7" rx="1"/>
      <rect x="35" y="68" width="20" height="7" rx="1"/>
      <rect x="60" y="68" width="20" height="7" rx="1"/>
    </g>
  </g>

  <!-- [B] 校舎と体育館の間に立つ「黄金色に輝く大イチョウ（銀杏）の木」！ -->
  <g class="outline" transform="translate(145, 130)">
    <!-- 幹 -->
    <rect x="12" y="30" width="8" height="40" fill="#78350f"/>
    <!-- 鮮やかな黄色のイチョウの葉クラスタ（写真のアイコニックなアクセント） -->
    <polygon points="16,0 0,40 32,40" fill="#facc15"/>
    <polygon points="16,-10 4,20 28,20" fill="#fde047"/>
    <ellipse cx="28" cy="25" rx="10" ry="16" fill="#facc15"/>
  </g>

  <!-- [C] 手前右側の大きな体育館（切妻大屋根と大きな格子窓・外階段） -->
  <g id="gymnasium" transform="translate(165, 115)">
    <!-- 体育館壁面（白） -->
    <rect x="10" y="45" width="160" height="90" fill="#f8fafc" class="outline"/>

    <!-- 切妻大屋根（ダークグレー・茶褐色の大きな屋根） -->
    <polygon points="0,45 170,45 125,5 30,5" fill="#57534e" class="outline"/>
    <line x1="5" y1="44" x2="165" y2="44" stroke="#292524" stroke-width="3"/>

    <!-- 体育館側面の大きな採光窓（格子ガラス窓群） -->
    <g fill="#38bdf8" class="fine-line">
      <rect x="95" y="55" width="60" height="35" rx="2"/>
      <line x1="115" y1="55" x2="115" y2="90" stroke="#ffffff" stroke-width="2"/>
      <line x1="135" y1="55" x2="135" y2="90" stroke="#ffffff" stroke-width="2"/>
      <line x1="95" y1="72" x2="155" y2="72" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- 体育館正面のピロティ・柱 -->
    <g class="fine-line" fill="#e2e8f0">
      <rect x="25" y="55" width="15" height="50"/>
      <rect x="50" y="55" width="15" height="50"/>
      <rect x="75" y="55" width="15" height="50"/>
    </g>

    <!-- 写真の特徴的な外階段（黄色い手すりの斜め階段） -->
    <g class="outline">
      <line x1="105" y1="125" x2="128" y2="90" stroke="#ca8a04" stroke-width="5"/>
      <line x1="105" y1="130" x2="128" y2="95" stroke="#facc15" stroke-width="3"/>
    </g>
  </g>

  <!-- 手前のロータリー・植栽 -->
  <g class="outline">
    <ellipse cx="60" cy="235" rx="14" ry="10" fill="#15803d"/>
    <ellipse cx="85" cy="240" rx="12" ry="9" fill="#166534"/>
  </g>
</svg>
