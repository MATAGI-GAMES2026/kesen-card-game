<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .outline { stroke: #1e293b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .thin-line { stroke: #1e293b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="400" height="300" fill="url(#skyGrad)"/>
  <!-- 越喜来湾のリアス式海岸の山並み -->
  <path d="M 0 130 Q 140 100 250 125 T 400 115 L 400 160 L 0 160 Z" fill="#86efac"/>
  <!-- 紺碧の海（越喜来湾） -->
  <rect y="150" width="400" height="150" fill="url(#seaGrad)"/>
  <path d="M 30 170 Q 50 165 70 170 M 310 175 Q 330 170 350 175" fill="none" class="thin-line" stroke="#ffffff"/>

  <!-- 手前の砂浜・磯岩 -->
  <path class="outline" fill="#fed7aa" d="M 0 250 Q 200 230 400 250 L 400 300 L 0 300 Z"/>

  <!-- 高級アワビ（あわびの貝殻と身） -->
  <g class="outline" transform="translate(60, 165)">
    <!-- 殻 -->
    <path fill="#78716c" d="M 10 70 Q 0 20 50 10 Q 110 5 125 45 Q 135 85 85 95 Q 35 100 10 70 Z"/>
    <path fill="#a8a29e" d="M 18 65 Q 10 25 50 18 Q 100 15 115 48 Q 120 80 80 88 Q 38 90 18 65 Z"/>
    <!-- 貝殻の呼水孔（並んだ小さな丸穴） -->
    <circle cx="35" cy="22" r="3" fill="#1e293b"/>
    <circle cx="50" cy="18" r="3" fill="#1e293b"/>
    <circle cx="68" cy="18" r="3" fill="#1e293b"/>
    <circle cx="86" cy="22" r="3" fill="#1e293b"/>
    <circle cx="102" cy="30" r="3" fill="#1e293b"/>
    <!-- ぷっくりしたアワビの身 -->
    <ellipse cx="68" cy="55" rx="38" ry="24" fill="#fef08a"/>
    <ellipse cx="68" cy="55" rx="30" ry="18" fill="#fde047"/>
  </g>

  <!-- 特産のホタテガイ（扇形の可愛いホタテ貝） -->
  <g class="outline" transform="translate(225, 175)">
    <!-- 貝殻の扇形 -->
    <path fill="#f8fafc" d="
      M 40 85 
      L 35 75 
      C 10 70, -5 45, 10 20 
      C 25 -5, 75 -5, 90 20 
      C 105 45, 90 70, 65 75 
      L 60 85 
      Z
    "/>
    <path fill="#fed7aa" d="
      M 40 80 
      C 20 65, 10 45, 20 25 
      C 32 5, 68 5, 80 25 
      C 90 45, 80 65, 60 80 
      Z
    "/>
    <!-- 貝殻の放射リブライン -->
    <g class="thin-line" stroke="#ca8a04" fill="none">
      <line x1="50" y1="80" x2="20" y2="25"/>
      <line x1="50" y1="80" x2="35" y2="12"/>
      <line x1="50" y1="80" x2="50" y2="8"/>
      <line x1="50" y1="80" x2="65" y2="12"/>
      <line x1="50" y1="80" x2="80" y2="25"/>
    </g>
  </g>

  <!-- 越喜来湾のリアス式海岸と特産アワビ・ホタテ -->
</svg>

