<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- 青空グラデーション（太陽なし） -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="bayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <style>
      .outline { stroke: #1e293b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .mid-line { stroke: #1e293b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .fine-line { stroke: #1e293b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .pipe-line { stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 1. 爽やかな青空 -->
  <rect width="400" height="300" fill="url(#skyGrad)"/>

  <!-- 白い雲 -->
  <g fill="#ffffff" class="mid-line">
    <path d="M 30 45 Q 45 32 70 38 Q 85 28 100 38 Q 112 38 116 48 Q 118 58 102 64 L 35 64 Z"/>
    <path d="M 270 35 Q 285 22 305 28 Q 320 18 335 28 Q 348 28 352 38 Q 355 48 340 52 L 275 52 Z"/>
  </g>

  <!-- 2. 工場の背後にそびえる緑深い山並み -->
  <path d="M 0 110 Q 140 40 280 80 T 400 65 L 400 170 L 0 170 Z" fill="#86efac"/>
  <path class="outline" fill="#15803d" d="M 0 130 Q 160 55 300 95 T 400 80 L 400 190 L 0 190 Z"/>

  <!-- 山肌の石灰岩採掘段差（白いベンチカットライン） -->
  <path d="M 20 135 L 70 120 L 90 128 L 50 142 Z" fill="#e2e8f0" class="fine-line"/>

  <!-- 3. 手前の大船渡湾の海 -->
  <rect y="210" width="400" height="90" fill="url(#bayGrad)"/>
  <line x1="0" y1="210" x2="400" y2="210" class="mid-line" stroke="#0369a1"/>
  <!-- 海面の波 -->
  <g class="mid-line" stroke="#38bdf8" fill="none">
    <path d="M 30 240 Q 60 232 90 240"/>
    <path d="M 310 235 Q 340 228 370 235"/>
    <path d="M 120 270 Q 160 262 200 270"/>
  </g>

  <!-- ==========================================
       4. 太平洋セメント大船渡工場（赤白大煙突と重厚なプラント群）
       ========================================== -->
  <g id="cement-factory">
    <!-- 岸壁・敷地エプロン -->
    <rect x="0" y="200" width="400" height="15" fill="#64748b" class="outline"/>

    <!-- [A] セメントサイロ群（巨大な円筒形サイロ・ライトグレー） -->
    <!-- 右側サイロ群 -->
    <rect x="330" y="150" width="30" height="55" rx="3" fill="#cbd5e1" class="outline"/>
    <rect x="365" y="155" width="28" height="50" rx="3" fill="#cbd5e1" class="outline"/>
    <ellipse cx="345" cy="150" rx="15" ry="5" fill="#e2e8f0" class="fine-line"/>
    <ellipse cx="379" cy="155" rx="14" ry="5" fill="#e2e8f0" class="fine-line"/>

    <!-- 左側大型サイロ・キルン建屋 -->
    <rect x="250" y="145" width="70" height="60" fill="#94a3b8" class="outline"/>
    <polygon points="250,145 320,145 310,130 260,130" fill="#64748b" class="fine-line"/>

    <!-- [B] 複雑な配管・トラス鉄骨・コンベヤパイプ -->
    <!-- 斜めに走る長大なベルトコンベアトラス -->
    <line x1="120" y1="185" x2="250" y2="155" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="185" x2="250" y2="155" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="280" y1="145" x2="350" y2="175" stroke="#475569" stroke-width="6"/>

    <!-- 煙突周りのトラス鉄骨タワー（格子組み） -->
    <g class="fine-line" stroke="#64748b" fill="none">
      <rect x="135" y="125" width="45" height="80"/>
      <line x1="135" y1="125" x2="180" y2="150"/>
      <line x1="180" y1="125" x2="135" y2="150"/>
      <line x1="135" y1="150" x2="180" y2="175"/>
      <line x1="180" y1="150" x2="135" y2="175"/>
      <line x1="135" y1="175" x2="180" y2="205"/>
      <line x1="180" y1="175" x2="135" y2="205"/>
    </g>

    <!-- [C] 象徴的な「赤白ツートンの巨大煙突」！（天高くそびえる赤崎のシンボル） -->
    <g class="outline">
      <!-- 煙突本体（テーパー形状の煙突タワー） -->
      <polygon points="152,40 162,40 166,205 148,205" fill="#ffffff"/>
      <!-- 赤いストライプバンド（上から交互に赤・白・赤・白・赤） -->
      <!-- バンド1（最上段） -->
      <polygon points="152,40 162,40 163,55 151,55" fill="#ef4444"/>
      <!-- バンド2 -->
      <polygon points="150,70 164,70 164.5,88 149.5,88" fill="#ef4444"/>
      <!-- バンド3 -->
      <polygon points="149,105 165,105 165.5,123 148.5,123" fill="#ef4444"/>
    </g>

    <!-- 左端の岸壁クレーン（黄色いガントリークレーン） -->
    <g class="mid-line" stroke="#eab308" fill="none">
      <polygon points="20,205 35,165 55,165 70,205" stroke-width="4"/>
      <line x1="25" y1="165" x2="80" y2="145" stroke-width="4.5"/>
    </g>
  </g>

  <!-- 手前の海上に浮かぶ青い作業船・台船（タグボート） -->
  <g class="outline" transform="translate(170, 220)">
    <rect x="0" y="12" width="65" height="15" rx="3" fill="#0284c7"/>
    <rect x="15" y="4" width="22" height="12" rx="2" fill="#ffffff"/>
    <rect x="25" y="7" width="8" height="6" fill="#38bdf8"/>
    <!-- 小さな煙突 -->
    <line x1="32" y1="0" x2="32" y2="4" class="mid-line" stroke="#ef4444"/>
  </g>
</svg>
