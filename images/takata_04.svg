<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- 青空（太陽なし） -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .outline { stroke: #1e293b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .thin-line { stroke: #1e293b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .rope-line { stroke: #78350f; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 1. 爽やかな青空 -->
  <rect width="400" height="300" fill="url(#skyGrad)"/>

  <!-- 雲 -->
  <g fill="#ffffff" class="thin-line">
    <path d="M 30 45 Q 45 32 70 38 Q 85 28 100 38 Q 112 38 118 48 Q 120 58 105 64 L 35 64 Z"/>
  </g>

  <!-- 2. 箱根山から見下ろす広田湾のパノラマ海と山並み -->
  <!-- 遠くの山（リアス海岸） -->
  <path d="M 0 115 Q 120 85 240 105 T 400 95 L 400 145 L 0 145 Z" fill="#93c5fd"/>
  <!-- 広田湾の青い海 -->
  <rect y="125" width="400" height="40" fill="url(#oceanGrad)"/>
  <line x1="0" y1="125" x2="400" y2="125" class="thin-line" stroke="#0369a1"/>
  <!-- 箱根山の山腹の森林（針葉樹） -->
  <path class="outline" fill="#22c55e" d="M 0 145 Q 180 130 400 140 L 400 185 L 0 185 Z"/>
  <path class="outline" fill="#15803d" d="M 0 165 Q 150 150 400 160 L 400 210 L 0 210 Z"/>

  <!-- 手前の芝生広場・グラウンド -->
  <path class="outline" fill="#fed7aa" d="M 0 210 L 400 210 L 400 300 L 0 300 Z"/>

  <!-- ===============================
       箱根山・木造帆船アスレチック「わんぱく丸」
       =============================== -->
  <g id="wanpaku-maru" transform="translate(45, 65)">
    <!-- 船体（木組みの帆船・ダークブラウン/キャラメル） -->
    <!-- 船底・木組みグリッド -->
    <path class="outline" fill="#b45309" d="
      M 40 160 
      L 20 120 
      L 85 120 
      L 245 120 
      L 260 145 
      L 245 175 
      L 65 175 
      Z
    "/>
    <!-- 船体の板張りライン -->
    <line x1="28" y1="138" x2="252" y2="138" class="thin-line" stroke="#78350f"/>
    <line x1="45" y1="156" x2="245" y2="156" class="thin-line" stroke="#78350f"/>

    <!-- 船首の突き出しバウ（三角の船首）と「わんぱく丸」看板 -->
    <polygon points="20,120 0,95 25,95 40,120" fill="#9a3412" class="outline"/>
    <!-- 看板 -->
    <g class="outline">
      <rect x="25" y="122" width="60" height="24" rx="4" fill="#78350f"/>
      <text x="55" y="138" font-size="9" font-weight="900" fill="#fef08a" text-anchor="middle" font-family="sans-serif">わんぱく丸</text>
    </g>

    <!-- デッキの木製展望やぐら・マストタワー -->
    <!-- 中央マスト（天高く伸びる柱） -->
    <rect x="140" y="10" width="8" height="150" fill="#78350f" class="outline"/>
    <!-- 前マスト -->
    <rect x="90" y="45" width="6" height="115" fill="#78350f" class="outline"/>

    <!-- マストの白い帆（風をはらんだ帆） -->
    <!-- 中央マストの3段の帆 -->
    <g class="outline" fill="#ffffff">
      <!-- 上帆 -->
      <path d="M 135 25 Q 125 35 135 45 L 153 45 Q 163 35 153 25 Z"/>
      <!-- 中帆 -->
      <path d="M 130 55 Q 120 68 130 80 L 158 80 Q 168 68 158 55 Z"/>
      <!-- 下帆 -->
      <path d="M 125 90 Q 115 105 125 118 L 163 118 Q 173 105 163 90 Z"/>
      <!-- 前マストの三角帆 -->
      <path d="M 85 55 Q 65 75 85 95 L 95 95 L 95 55 Z"/>
    </g>
    <!-- マスト頂上の旗 -->
    <polygon points="148,10 168,16 148,22" fill="#ef4444" class="thin-line"/>

    <!-- ロープ・網（アスレチックネット） -->
    <line x1="90" y1="50" x2="20" y2="120" class="rope-line"/>
    <line x1="144" y1="20" x2="90" y2="60" class="rope-line"/>
    <line x1="144" y1="20" x2="245" y2="120" class="rope-line"/>

    <!-- すべり台（船尾から手前に滑り降りる水色／ステンレスのすべり台） -->
    <g class="outline">
      <!-- すべり台スロープ -->
      <path d="M 235 125 L 295 185 L 285 192 L 225 132 Z" fill="#38bdf8"/>
      <!-- すべり台の手すり -->
      <line x1="235" y1="125" x2="295" y2="185" stroke="#0284c7" stroke-width="4"/>
      <line x1="225" y1="132" x2="285" y2="192" stroke="#0284c7" stroke-width="4"/>
      <!-- すべり台脚柱 -->
      <line x1="265" y1="155" x2="265" y2="185" class="thin-line" stroke="#64748b"/>
    </g>

    <!-- 昇降ハシゴ・階段（船首側） -->
    <g class="thin-line" stroke="#78350f">
      <line x1="70" y1="140" x2="55" y2="185" stroke-width="4"/>
      <line x1="82" y1="140" x2="67" y2="185" stroke-width="4"/>
      <line x1="68" y1="150" x2="80" y2="150"/>
      <line x1="64" y1="160" x2="76" y2="160"/>
      <line x1="60" y1="170" x2="72" y2="170"/>
    </g>
  </g>
</svg>
