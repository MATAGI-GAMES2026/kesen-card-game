<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <style>
      .outline { stroke: #1e293b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .thin-line { stroke: #1e293b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="400" height="300" fill="url(#skyGrad)"/>
  <!-- 雲 -->
  <g fill="#ffffff" class="thin-line">
    <path d="M 300 45 Q 315 32 335 38 Q 350 28 365 38 Q 378 38 382 48 Q 385 58 370 64 L 305 64 Z"/>
  </g>
  <!-- 遠くの海と丘 -->
  <path d="M 0 140 Q 180 125 400 135 L 400 170 L 0 170 Z" fill="#0284c7"/>
  <!-- りんご果樹園のなだらかな丘 -->
  <path class="outline" fill="#86efac" d="M 0 170 Q 200 140 400 165 L 400 300 L 0 300 Z"/>
  <path class="outline" fill="#4ade80" d="M 0 220 Q 180 190 400 230 L 400 300 L 0 300 Z"/>

  <!-- りんごの木（背景） -->
  <g class="outline" transform="translate(40, 110)">
    <rect x="25" y="40" width="10" height="40" fill="#78350f"/>
    <ellipse cx="30" cy="35" rx="35" ry="25" fill="#22c55e"/>
    <circle cx="15" cy="30" r="5" fill="#ef4444"/>
    <circle cx="40" cy="25" r="5" fill="#ef4444"/>
    <circle cx="28" cy="45" r="5" fill="#ef4444"/>
  </g>
  <g class="outline" transform="translate(300, 120)">
    <rect x="25" y="40" width="10" height="40" fill="#78350f"/>
    <ellipse cx="30" cy="35" rx="30" ry="22" fill="#22c55e"/>
    <circle cx="20" cy="30" r="5" fill="#ef4444"/>
    <circle cx="38" cy="38" r="5" fill="#ef4444"/>
  </g>

  <!-- 手前の大きな真っ赤な「米崎りんご」（メインモチーフ） -->
  <g class="outline" transform="translate(140, 140)">
    <!-- 葉っぱとヘタ -->
    <path d="M 58 10 Q 56 0 60 -10 L 64 -10 Q 62 0 62 10 Z" fill="#78350f"/>
    <path d="M 62 -2 Q 85 -18 90 -2 Q 78 12 62 4 Z" fill="#22c55e"/>
    <!-- りんごの実（ツヤツヤの赤） -->
    <path fill="#ef4444" d="
      M 60 12 
      C 45 0, 0 10, 0 60 
      C 0 105, 30 130, 58 130 
      C 60 130, 62 130, 64 130 
      C 92 130, 122 105, 122 60 
      C 122 10, 75 0, 60 12 
      Z
    "/>
    <!-- ハイライト（ツヤ） -->
    <ellipse cx="28" cy="45" rx="10" ry="22" transform="rotate(-25 28 45)" fill="#fca5a5" stroke="none"/>
    <ellipse cx="25" cy="42" rx="4" ry="12" transform="rotate(-25 25 42)" fill="#ffffff" stroke="none"/>
  </g>
</svg>
