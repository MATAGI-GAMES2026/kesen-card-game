<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- 青空グラデーション -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- 滝の水流グラデーション -->
    <linearGradient id="waterfallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <style>
      .outline { stroke: #1e293b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .mid-line { stroke: #1e293b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .fine-line { stroke: #1e293b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .wood-line { stroke: #44403c; stroke-width: 2.2; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 1. 爽やかな青空（太陽なし） -->
  <rect width="400" height="300" fill="url(#skyGrad)"/>

  <!-- 白い雲 -->
  <g fill="#ffffff" class="mid-line">
    <path d="M 25 35 Q 40 22 62 28 Q 75 18 90 28 Q 102 28 106 38 Q 108 48 95 52 L 30 52 Z"/>
    <path d="M 290 25 Q 305 15 322 20 Q 335 12 348 20 Q 360 20 364 28 Q 366 36 352 40 L 295 40 Z"/>
  </g>

  <!-- 2. お堂の背後を囲む新緑豊かな急峻な山（深山幽谷の自然） -->
  <path d="M 0 85 Q 120 45 220 70 T 400 55 L 400 140 L 0 140 Z" fill="#86efac"/>
  <path class="outline" fill="#22c55e" d="M 0 100 Q 140 65 260 90 T 400 75 L 400 170 L 0 170 Z"/>

  <!-- 左側：新緑の木立と岩肌を流れ落ちる清らかな滝 -->
  <g>
    <!-- 滝の岩壁と木立 -->
    <path class="outline" fill="#64748b" d="M 0 95 L 75 95 L 85 240 L 0 255 Z"/>
    <path fill="#475569" d="M 20 105 L 65 120 L 50 190 L 75 240 L 0 250 Z"/>
    <!-- 新緑の木々（杉・広葉樹） -->
    <ellipse cx="25" cy="85" rx="22" ry="14" fill="#15803d" class="outline"/>
    <ellipse cx="58" cy="80" rx="25" ry="15" fill="#166534" class="outline"/>

    <!-- 白い水流（滝） -->
    <path fill="url(#waterfallGrad)" d="
      M 32 95 
      Q 28 150 25 210 
      L 52 210 
      Q 50 150 48 95 
      Z
    " class="outline"/>
    <line x1="38" y1="105" x2="36" y2="205" class="mid-line" stroke="#ffffff"/>
    <line x1="44" y1="105" x2="44" y2="205" class="mid-line" stroke="#ffffff"/>

    <!-- 滝壺・せせらぎ -->
    <ellipse cx="38" cy="212" rx="22" ry="8" fill="#38bdf8" class="outline"/>
    <path class="outline" fill="#0284c7" d="M 15 215 Q 35 235 20 270 L 0 280 L 0 220 Z"/>
  </g>

  <!-- 3. 境内・地面（敷石参道と玉砂利） -->
  <path class="outline" fill="#fed7aa" d="M 0 200 L 400 185 L 400 300 L 0 300 Z"/>
  <path class="outline" fill="#e2e8f0" d="M 50 220 L 400 205 L 400 300 L 30 300 Z"/>

  <!-- ==========================================
       4. 閑董院 宥健尊師堂（添付写真に基づき忠実にデフォルメ！）
       ========================================== -->
  <g id="yuken-temple-main" transform="translate(100, 32)">

    <!-- [A] 高床下の基礎・柱組み（縁の下の木組み） -->
    <g class="outline" fill="#57534e">
      <!-- 床下柱（6本） -->
      <rect x="25" y="165" width="8" height="40"/>
      <rect x="52" y="165" width="8" height="40"/>
      <rect x="80" y="165" width="8" height="40"/>
      <rect x="135" y="165" width="8" height="40"/>
      <rect x="162" y="165" width="8" height="40"/>
      <rect x="190" y="165" width="8" height="40"/>
      <!-- 床下の貫（横木） -->
      <line x1="20" y1="185" x2="202" y2="185" stroke="#292524" stroke-width="4.5"/>
    </g>

    <!-- [B] 高床の回廊（濡れ縁）と高欄手すり（擬宝珠付き） -->
    <rect x="15" y="155" width="195" height="12" fill="#78716c" class="outline"/>
    <!-- 手すり（左右の高欄） -->
    <g class="mid-line" stroke="#292524">
      <line x1="18" y1="138" x2="78" y2="138" stroke-width="4"/>
      <line x1="145" y1="138" x2="205" y2="138" stroke-width="4"/>
      <!-- 縦桟子 -->
      <line x1="26" y1="138" x2="26" y2="155"/>
      <line x1="46" y1="138" x2="46" y2="155"/>
      <line x1="66" y1="138" x2="66" y2="155"/>
      <line x1="156" y1="138" x2="156" y2="155"/>
      <line x1="176" y1="138" x2="176" y2="155"/>
      <line x1="196" y1="138" x2="196" y2="155"/>
      <!-- 親柱の擬宝珠（ぎぼし・金茶） -->
      <circle cx="18" cy="134" r="3.5" fill="#ca8a04"/>
      <circle cx="78" cy="134" r="3.5" fill="#ca8a04"/>
      <circle cx="145" cy="134" r="3.5" fill="#ca8a04"/>
      <circle cx="205" cy="134" r="3.5" fill="#ca8a04"/>
    </g>

    <!-- [C] 正面階段（参道から登る木製階段・5段） -->
    <g class="outline" fill="#8c857b">
      <polygon points="80,156 72,198 152,198 144,156"/>
      <!-- 段差ライン -->
      <line x1="78" y1="165" x2="146" y2="165" class="mid-line"/>
      <line x1="76" y1="174" x2="148" y2="174" class="mid-line"/>
      <line x1="74" y1="183" x2="150" y2="183" class="mid-line"/>
      <line x1="72" y1="191" x2="152" y2="191" class="mid-line"/>
    </g>

    <!-- [D] お堂本体の壁面（年月を経た渋い木肌色 #8c857b） -->
    <rect x="32" y="80" width="160" height="76" fill="#8c857b" class="outline"/>

    <!-- [E] 格子戸（写真の特徴：升目状の格子がびっしり並ぶ四枚戸！） -->
    <!-- 左右の板壁・脇間格子 -->
    <g class="fine-line" fill="#6e675f">
      <!-- 左脇間 -->
      <rect x="36" y="86" width="38" height="66"/>
      <line x1="55" y1="86" x2="55" y2="152"/>
      <line x1="36" y1="108" x2="74" y2="108"/>
      <line x1="36" y1="130" x2="74" y2="130"/>
      <!-- 右脇間 -->
      <rect x="150" y="86" width="38" height="66"/>
      <line x1="169" y1="86" x2="169" y2="152"/>
      <line x1="150" y1="108" x2="188" y2="108"/>
      <line x1="150" y1="130" x2="188" y2="130"/>
    </g>

    <!-- 中央の正面前扉（升目格子戸） -->
    <g class="fine-line" fill="#57524b">
      <rect x="78" y="86" width="68" height="68"/>
      <!-- 升目の縦横格子線（写真の四角い升目格子を再現） -->
      <!-- 縦線（3本で4枚戸） -->
      <line x1="95" y1="86" x2="95" y2="154" stroke-width="2.5"/>
      <line x1="112" y1="86" x2="112" y2="154" stroke-width="2.5"/>
      <line x1="129" y1="86" x2="129" y2="154" stroke-width="2.5"/>
      <!-- 横格子線 -->
      <line x1="78" y1="98" x2="146" y2="98"/>
      <line x1="78" y1="110" x2="146" y2="110"/>
      <line x1="78" y1="122" x2="146" y2="122"/>
      <line x1="78" y1="134" x2="146" y2="134"/>
      <line x1="78" y1="146" x2="146" y2="146"/>
    </g>

    <!-- [F] 向拝柱（正面の太い2本の本柱）と礎石 -->
    <rect x="74" y="80" width="10" height="90" fill="#78716c" class="outline"/>
    <rect x="140" y="80" width="10" height="90" fill="#78716c" class="outline"/>
    <!-- 柱の根元の金物・礎石 -->
    <rect x="73" y="165" width="12" height="6" fill="#334155" class="fine-line"/>
    <rect x="139" y="165" width="12" height="6" fill="#334155" class="fine-line"/>

    <!-- [G] 2本の長い鈴緒（白い綱が向拝中央から長く垂れ下がる！） -->
    <g class="mid-line" stroke="#f8fafc" stroke-width="4">
      <line x1="108" y1="92" x2="107" y2="160"/>
      <line x1="117" y1="92" x2="117" y2="160"/>
    </g>
    <!-- 綱の網目模様（斜めスジ） -->
    <g class="fine-line" stroke="#cbd5e1">
      <line x1="105" y1="110" x2="109" y2="114"/>
      <line x1="105" y1="130" x2="109" y2="134"/>
      <line x1="115" y1="110" x2="119" y2="114"/>
      <line x1="115" y1="130" x2="119" y2="134"/>
    </g>
    <!-- 鈴（向拝の天井下） -->
    <circle cx="112" cy="90" r="5" fill="#ca8a04" class="mid-line"/>

    <!-- [H] 軒下の重厚な木組み（組物・斗栱・尾垂木）と木彫刻 -->
    <!-- 軒下の斗栱クラスタ（三手先の段々木組み） -->
    <g fill="#57534b" class="fine-line">
      <rect x="25" y="72" width="175" height="12"/>
      <!-- 肘木ブロック -->
      <rect x="35" y="66" width="15" height="8"/>
      <rect x="65" y="66" width="20" height="8"/>
      <rect x="102" y="66" width="20" height="8"/>
      <rect x="140" y="66" width="20" height="8"/>
      <rect x="175" y="66" width="15" height="8"/>
    </g>

    <!-- 向拝の木彫り虹梁＆龍・波の彫刻（気仙大工の見事な彫刻！） -->
    <g class="outline" fill="#6e675f">
      <!-- 虹梁（湾曲した梁） -->
      <path d="M 74 85 Q 112 78 150 85 L 150 93 Q 112 86 74 93 Z"/>
      <!-- 龍の頭・木彫刻（向拝柱の外側への突き出し・木鼻） -->
      <path d="M 74 86 Q 62 82 60 90 Q 64 96 74 92 Z"/>
      <path d="M 150 86 Q 162 82 164 90 Q 160 96 150 92 Z"/>
      <!-- 中央の欄間彫刻（波と雲） -->
      <ellipse cx="112" cy="80" rx="16" ry="6" fill="#57534b"/>
    </g>

    <!-- [I] 堂々たる大屋根＆正面の「唐破風（からはふ）」！ -->
    <!-- 1. 正面向拝の唐破風（写真の最も象徴的な美しい弓なりのカーブ！） -->
    <path class="outline" fill="#383430" d="
      M 60 74 
      Q 95 68 100 58 
      Q 112 45 124 58 
      Q 129 68 164 74 
      L 164 64 
      Q 130 58 123 48 
      Q 112 36 101 48 
      Q 94 58 60 64 
      Z
    "/>
    <!-- 唐破風の妻飾り（懸魚・げぎょ） -->
    <polygon points="112,50 106,62 118,62" fill="#57534b" class="fine-line"/>

    <!-- 2. 本堂の大屋根（寄棟・四方に大きく広がり、軒先がグッと跳ね上がる大迫力！） -->
    <path class="outline" fill="#292524" d="
      M -28 72 
      Q 112 40 252 72 
      L 242 58 
      Q 112 30 -18 58 
      Z
    "/>
    <!-- 屋根の平（四角錐・宝形造の稜線） -->
    <path class="outline" fill="#3e3935" d="
      M -18 58 
      Q 112 30 242 58 
      L 190 6 
      Q 112 -4 34 6 
      Z
    "/>
    <!-- 屋根の銅板葺き・横段ライン（細かい屋根の質感） -->
    <g class="fine-line" stroke="#262220">
      <path d="M -5 50 Q 112 25 228 50" fill="none"/>
      <path d="M 8 40 Q 112 18 215 40" fill="none"/>
      <path d="M 20 28 Q 112 10 203 28" fill="none"/>
      <path d="M 30 16 Q 112 2 193 16" fill="none"/>
    </g>

    <!-- 頂上の大棟・宝珠（露盤と丸い宝珠） -->
    <rect x="104" y="-3" width="16" height="8" fill="#1c1917" class="outline"/>
    <circle cx="112" cy="-9" r="6" fill="#ca8a04" class="outline"/>
  </g>

  <!-- ==========================================
       5. 手前右側の石造り狛犬（写真の通り階段右に鎮座し、足元に玉を抱える！）
       ========================================== -->
  <g id="komainu" class="outline" transform="translate(265, 172) scale(0.95)">
    <!-- 台座石（御影石・グレー） -->
    <rect x="15" y="88" width="75" height="22" fill="#94a3b8"/>
    <rect x="20" y="93" width="65" height="12" fill="#cbd5e1"/>

    <!-- 狛犬本体（力強い石彫刻） -->
    <!-- 後ろ足と腰 -->
    <ellipse cx="62" cy="68" rx="24" ry="20" fill="#cbd5e1"/>
    <!-- 巻き尾（上に向かって力強く立ち上がる尾） -->
    <path d="M 78 62 Q 98 35 88 18 Q 72 24 76 52 Z" fill="#cbd5e1"/>

    <!-- 前足と足元の丸い玉（毬・宝珠を前足でしっかり抱える！） -->
    <rect x="30" y="52" width="14" height="40" rx="4" fill="#cbd5e1"/>
    <!-- 足元の玉（透かし彫り文様のある宝珠） -->
    <circle cx="36" cy="85" r="13" fill="#facc15"/>
    <circle cx="36" cy="85" r="13" fill="none" class="mid-line"/>
    <line x1="28" y1="85" x2="44" y2="85" class="fine-line" stroke="#ca8a04"/>
    <line x1="36" y1="77" x2="36" y2="93" class="fine-line" stroke="#ca8a04"/>

    <!-- 頭・巻きたてがみ・顔（迫力ある阿形の狛犬） -->
    <ellipse cx="40" cy="38" rx="20" ry="18" fill="#cbd5e1"/>
    <!-- 巻き毛のたてがみクラスタ（立体的） -->
    <circle cx="56" cy="26" r="8" fill="#cbd5e1"/>
    <circle cx="60" cy="40" r="8" fill="#cbd5e1"/>
    <circle cx="56" cy="54" r="8" fill="#cbd5e1"/>
    <circle cx="44" cy="18" r="7" fill="#cbd5e1"/>

    <!-- 目・牙・開いた口 -->
    <circle cx="30" cy="34" r="3.5" fill="#1e293b"/>
    <ellipse cx="22" cy="38" rx="5" ry="3.5" fill="#64748b"/>
    <!-- 大きく開いた口と牙 -->
    <path d="M 20 44 Q 30 52 38 45" fill="none" class="mid-line"/>
    <polygon points="23,44 26,48 27,44" fill="#ffffff"/>
  </g>
</svg>
